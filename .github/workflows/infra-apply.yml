name: infra-apply

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Environment to apply'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      plan_artifact_name:
        description: 'Saved plan artifact name (infra-plan-<env>)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target_environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.8

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.plan_artifact_name }}
          path: infra/opentofu/environments/${{ github.event.inputs.target_environment }}

      - name: Apply saved plan
        working-directory: infra/opentofu/environments/${{ github.event.inputs.target_environment }}
        run: |
          tofu init -backend-config=backend.hcl
          tofu apply -auto-approve plan.tfplan

      - name: Capture outputs
        working-directory: infra/opentofu/environments/${{ github.event.inputs.target_environment }}
        run: tofu output -json > outputs.json

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: infra-outputs-${{ github.event.inputs.target_environment }}
          retention-days: 30
          path: infra/opentofu/environments/${{ github.event.inputs.target_environment }}/outputs.json

      - name: Cleanup local output artifacts
        if: always()
        run: rm -f infra/opentofu/environments/${{ github.event.inputs.target_environment }}/outputs.json
